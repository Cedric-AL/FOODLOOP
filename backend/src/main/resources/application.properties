spring.application.name=foodloop-backend

# Server configuration
server.port=${SERVER_PORT:8080}

# Supabase PostgreSQL settings
spring.datasource.url=${DB_URL:jdbc:postgresql://your-supabase-host:5432/postgres}
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic DB startup if the environment is not configured yet
# This keeps the project ready for future Supabase integration without requiring a live DB for basic startup checks.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Security configuration placeholder
# Spring Security will be added when authentication is implemented.
